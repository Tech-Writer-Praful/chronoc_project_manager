<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chronos - Minimalist Work & Time Tracker</title>
    <meta name="description" content="Minimalist Kanban board with granular time tracking, project-duration burn-up and burn-down charts, team spaces, role-based access control, and local offline-first storage." />
    <meta property="og:title" content="Chronos - Minimalist Work & Time Tracker" />
    <meta property="og:description" content="Minimalist Kanban board with granular time tracking, project-duration burn-up and burn-down charts, team spaces, role-based access control, and local offline-first storage." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Guard against browser extensions attempting to overwrite window.fetch when configured with only a getter
      (function() {
        try {
          var _fetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return _fetch; },
            set: function(val) { _fetch = val; },
            configurable: true,
            enumerable: true
          });
        } catch (_) {}

        // Suppress external chrome-extension errors from polluting page execution
        window.addEventListener('error', function(event) {
          if (event && (
            (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
            (event.message && event.message.indexOf('chrome-extension://') !== -1) ||
            (event.message && event.message.indexOf('Cannot set property fetch') !== -1)
          )) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
